<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoMoYo-Yanke's Blog</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23e8f0fe'/><stop offset='1' stop-color='%23c7d9f7'/></linearGradient></defs><path d='M32 1 L59 17.5 L59 46.5 L32 63 L5 46.5 L5 17.5 Z' fill='url(%23g)'/><text x='32' y='44' font-size='45' font-family='Arial Black,sans-serif' font-weight='900' fill='black' stroke='%232c4a7c' stroke-width='1.2' text-anchor='middle'>Y</text></svg>">
        
    <style>
        /* ===================== 设计变量 ===================== */
        :root {
            color-scheme: light;

            --bg: #e9eef8;
            --bg-soft: #f4f7fd;
            --surface: #ffffff;
            --text: #0f172a;
            --text-soft: #55647d;
            --text-mute: #8b98ad;

            --border: rgba(15, 23, 42, .09);
            --border-strong: rgba(15, 23, 42, .16);
            --accent: #2563eb;
            --accent-2: #7c3aed;
            --accent-soft: rgba(37, 99, 235, .10);
            --success: #16a34a;
            --code-bg: rgba(255, 255, 255, .62);

            --grid: rgba(15, 23, 42, .10);
            --glow-a: #6366f1;
            --glow-b: #06b6d4;
            --glow-c: #ec4899;

            /* 玻璃 */
            --glass: rgba(255, 255, 255, .58);
            --glass-strong: rgba(255, 255, 255, .82);
            --glass-border: rgba(255, 255, 255, .85);
            --glass-line: rgba(15, 23, 42, .07);
            --glass-hi: rgba(255, 255, 255, .9);
            --blur: 18px;

            --shadow-sm: 0 1px 2px rgba(15, 23, 42, .06);
            --shadow: 0 12px 32px -16px rgba(15, 23, 42, .28), 0 2px 6px rgba(15, 23, 42, .05);
            --shadow-lg: 0 28px 64px -24px rgba(15, 23, 42, .40);

            --radius: 16px;
            --radius-sm: 10px;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
        }

        [data-theme="dark"] {
            color-scheme: dark;

            --bg: #060910;
            --bg-soft: #0b1220;
            --surface: #0f172a;
            --text: #e6edf7;
            --text-soft: #94a3b8;
            --text-mute: #64748b;

            --border: rgba(255, 255, 255, .08);
            --border-strong: rgba(255, 255, 255, .16);
            --accent: #60a5fa;
            --accent-2: #c084fc;
            --accent-soft: rgba(96, 165, 250, .14);
            --success: #4ade80;
            --code-bg: rgba(255, 255, 255, .045);

            --grid: rgba(255, 255, 255, .075);
            --glow-a: #4338ca;
            --glow-b: #0e7490;
            --glow-c: #be185d;

            --glass: rgba(17, 25, 40, .55);
            --glass-strong: rgba(17, 25, 40, .82);
            --glass-border: rgba(255, 255, 255, .10);
            --glass-line: rgba(255, 255, 255, .08);
            --glass-hi: rgba(255, 255, 255, .12);

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
            --shadow: 0 12px 32px -16px rgba(0, 0, 0, .75), 0 2px 6px rgba(0, 0, 0, .35);
            --shadow-lg: 0 28px 64px -24px rgba(0, 0, 0, .85);
        }

        [data-theme="sepia"] {
            color-scheme: light;

            --bg: #f2e8d5;
            --bg-soft: #f9f2e5;
            --surface: #fdf8ee;
            --text: #3d2f1e;
            --text-soft: #7c6a51;
            --text-mute: #9c8b73;

            --border: rgba(61, 47, 30, .12);
            --border-strong: rgba(61, 47, 30, .25);
            --accent: #a0522d;
            --accent-2: #8b5cf6;
            --accent-soft: rgba(160, 82, 45, .12);
            --success: #2e7d32;
            --code-bg: rgba(255, 252, 245, .66);

            --grid: rgba(61, 47, 30, .10);
            --glow-a: #d97706;
            --glow-b: #0d9488;
            --glow-c: #be185d;

            --glass: rgba(255, 250, 240, .60);
            --glass-strong: rgba(255, 250, 240, .84);
            --glass-border: rgba(255, 255, 255, .75);
            --glass-line: rgba(61, 47, 30, .10);
            --glass-hi: rgba(255, 255, 255, .85);

            --shadow: 0 12px 32px -16px rgba(61, 47, 30, .25), 0 2px 6px rgba(61, 47, 30, .06);
            --shadow-lg: 0 28px 64px -24px rgba(61, 47, 30, .35);
        }

        /* ===================== 基础 ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            transition: background .3s ease, color .3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* 背景：极光色块 + 网格。固定在视口，滚动时不动 */
        body::before {
            content: '';
            position: fixed;
            inset: -10%;
            z-index: -2;
            background:
                radial-gradient(46rem 32rem at 10% -6%, color-mix(in srgb, var(--glow-a) 34%, transparent), transparent 62%),
                radial-gradient(40rem 28rem at 94% 2%, color-mix(in srgb, var(--glow-b) 28%, transparent), transparent 62%),
                radial-gradient(44rem 32rem at 52% 108%, color-mix(in srgb, var(--glow-c) 22%, transparent), transparent 64%);
            filter: blur(10px);
            animation: drift 28s ease-in-out infinite alternate;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 46px 46px;
            -webkit-mask-image: radial-gradient(ellipse 130% 95% at 50% 0%, #000 34%, transparent 92%);
            mask-image: radial-gradient(ellipse 130% 95% at 50% 0%, #000 34%, transparent 92%);
        }

        @keyframes drift {
            from {
                transform: translate3d(-1.5%, -1%, 0) scale(1);
            }

            to {
                transform: translate3d(1.5%, 1.5%, 0) scale(1.06);
            }
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        ::selection {
            background: color-mix(in srgb, var(--accent) 26%, transparent);
        }

        /* 玻璃基础样式。所有卡片共用 */
        .glass {
            background: var(--glass);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
        }

        @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
            .glass {
                background: var(--glass-strong);
            }
        }

        /* ===================== 导航 ===================== */
        .navbar {
            position: sticky;
            top: 12px;
            z-index: 100;
            margin: 12px auto 0;
            width: min(1180px, calc(100% - 32px));
            background: var(--glass);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
        }

        .navbar-inner {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 1.02em;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            letter-spacing: -.01em;
            white-space: nowrap;
        }

        .brand:hover {
            text-decoration: none;
        }

        .brand-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 0 3px var(--accent-soft), 0 0 12px var(--accent);
            display: inline-block;
            animation: pulse 2.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .55;
                transform: scale(.82);
            }
        }

        .nav-links {
            display: flex;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-links a {
            color: var(--text-soft);
            padding: 6px 13px;
            border-radius: 9px;
            font-size: .9em;
            cursor: pointer;
            transition: all .18s;
            white-space: nowrap;
        }

        .nav-links a:hover {
            background: var(--accent-soft);
            color: var(--text);
            text-decoration: none;
        }

        .nav-links a.active {
            color: var(--accent);
            background: var(--accent-soft);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent);
            animation: navPop .3s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes navPop {
            from {
                transform: scale(.92);
                opacity: .6;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: auto;
        }

        .theme-switch {
            display: flex;
            gap: 2px;
            background: color-mix(in srgb, var(--text) 5%, transparent);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 2px;
        }

        .theme-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .18s;
        }

        .theme-btn:hover {
            background: var(--border);
        }

        .theme-btn.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            box-shadow: 0 2px 8px -2px var(--accent);
        }

        .translate-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 34px;
            padding: 0 13px;
            background: color-mix(in srgb, var(--text) 5%, transparent);
            border: 1px solid var(--border);
            border-radius: 9px;
            cursor: pointer;
            font-size: .86em;
            color: var(--text-soft);
            transition: all .18s;
            font-family: inherit;
        }

        .translate-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ===================== 整体布局 ===================== */
        .shell {
            flex: 1;
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 72px;
            display: grid;
            grid-template-columns: 288px minmax(0, 1fr);
            grid-template-areas: "side main";
            gap: 22px;
            align-items: start;
        }

        .sidebar {
            grid-area: side;
            position: sticky;
            top: 84px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            /* 高度够就完全固定，不留内部滚动条；实在太小才允许滚一点 */
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
        }

        .sidebar::-webkit-scrollbar {
            width: 5px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 99px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .content {
            grid-area: main;
            min-width: 0;
        }

        /* ===================== 侧栏：名片 ===================== */
        .profile-card {
            padding: 16px;
            animation: slideInLeft .55s cubic-bezier(.16, 1, .3, 1) backwards;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -.02em;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 22px -8px var(--accent), inset 0 1px 0 rgba(255, 255, 255, .45);
        }

        /* 头像上一道扫过的高光 */
        .avatar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 34%, rgba(255, 255, 255, .42) 50%, transparent 66%);
            transform: translateX(-130%);
            animation: sheen 5.5s ease-in-out infinite;
        }

        @keyframes sheen {
            0%, 62% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-14px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .profile-id h2 {
            font-size: 1.06em;
            letter-spacing: -.01em;
            line-height: 1.3;
        }

        .profile-id .handle {
            font-family: var(--mono);
            font-size: .74em;
            color: var(--text-mute);
        }

        .profile-bio {
            color: var(--text-soft);
            font-size: .85em;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: .78em;
            color: var(--text-soft);
            background: color-mix(in srgb, var(--success) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--success) 24%, transparent);
            border-radius: 999px;
            padding: 3px 11px;
            margin-bottom: 11px;
        }

        .status .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .stat-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--glass-line);
            margin-bottom: 10px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 6px 2px;
            border-radius: 9px;
            cursor: pointer;
            transition: background .18s;
        }

        .stat:hover {
            background: var(--accent-soft);
            text-decoration: none;
        }

        .stat b {
            font-family: var(--mono);
            font-size: 1.16em;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            line-height: 1.2;
        }

        .stat span {
            font-size: .7em;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .profile-card .socials {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 侧栏小卡片 */
        .side-card {
            padding: 13px 15px;
            animation: slideInLeft .55s cubic-bezier(.16, 1, .3, 1) backwards .08s;
        }

        .side-title {
            font-family: var(--mono);
            font-size: .7em;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--text-mute);
            margin-bottom: 9px;
        }

        /* 合并后的「Topics / Stack」两段之间 */
        .side-title + .chips + .side-title {
            margin-top: 13px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            font-size: .76em;
            padding: 3px 9px;
            border-radius: 7px;
            background: color-mix(in srgb, var(--text) 5%, transparent);
            border: 1px solid var(--border);
            color: var(--text-soft);
            cursor: default;
            transition: all .18s;
        }

        .chip:hover {
            color: var(--accent);
            border-color: color-mix(in srgb, var(--accent) 45%, transparent);
            background: var(--accent-soft);
        }

        .chip .n {
            font-family: var(--mono);
            font-size: .92em;
            opacity: .65;
            margin-left: 3px;
        }

        /* ===================== Hero ===================== */
        .hero {
            position: relative;
            padding: 30px 28px 28px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent, var(--accent), transparent);
            background-size: 200% 100%;
            opacity: .75;
            animation: lineFlow 6s linear infinite;
        }

        @keyframes lineFlow {
            to {
                background-position: 200% 0;
            }
        }

        .hero-eyebrow {
            font-family: var(--mono);
            font-size: .7em;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .hero h1 {
            font-size: clamp(1.7em, 1.2em + 1.5vw, 2.35em);
            line-height: 1.15;
            letter-spacing: -.03em;
            margin-bottom: 10px;
        }

        .hero h1 .grad {
            background: linear-gradient(115deg, var(--accent), var(--accent-2), var(--accent));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradShift 8s ease-in-out infinite;
        }

        @keyframes gradShift {

            0%,
            100% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }
        }

        .hero p {
            color: var(--text-soft);
            font-size: .96em;
            max-width: 46em;
        }

        /* ===================== 数据块 ===================== */
        .tiles {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 24px;
        }

        .tile {
            padding: 14px 16px;
        }

        .tile b {
            display: block;
            font-family: var(--mono);
            font-size: 1.42em;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
            line-height: 1.3;
        }

        .tile span {
            font-size: .7em;
            color: var(--text-mute);
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        /* ===================== 搜索 ===================== */
        .search-wrap {
            position: relative;
            max-width: 520px;
            margin-top: 20px;
        }

        .search-input {
            width: 100%;
            padding: 11px 42px;
            font: inherit;
            font-size: .94em;
            color: var(--text);
            background: color-mix(in srgb, var(--text) 4%, transparent);
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }

        .search-input::placeholder {
            color: var(--text-mute);
        }

        .search-input:focus {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--surface) 55%, transparent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search-input::-webkit-search-cancel-button {
            display: none;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            color: var(--text-mute);
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--text-mute);
            font-size: .82em;
            line-height: 1;
            cursor: pointer;
        }

        .search-clear:hover {
            background: var(--border);
            color: var(--text);
        }

        .search-clear[hidden] {
            display: none;
        }

        .search-hint {
            margin-top: 10px;
            font-size: .76em;
            color: var(--text-mute);
            font-family: var(--mono);
        }

        .search-hint kbd {
            font: inherit;
            font-size: .94em;
            padding: 1px 6px;
            border: 1px solid var(--border);
            border-bottom-width: 2px;
            border-radius: 5px;
            background: color-mix(in srgb, var(--text) 5%, transparent);
            color: var(--text-soft);
        }

        .search-summary {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            font-size: .88em;
            color: var(--text-soft);
        }

        .search-note {
            font-size: .9em;
            opacity: .7;
            font-family: var(--mono);
        }

        mark {
            background: color-mix(in srgb, var(--accent) 22%, transparent);
            color: inherit;
            border-radius: 3px;
            padding: 0 2px;
            box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
        }

        #search-results[hidden],
        #home-default[hidden] {
            display: none;
        }

        /* ===================== 区块标题 ===================== */
        .section-title {
            font-family: var(--mono);
            font-size: .72em;
            text-transform: uppercase;
            letter-spacing: .16em;
            color: var(--text-mute);
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-line);
        }

        .section-title .count {
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 999px;
            padding: 1px 8px;
            font-size: .95em;
            letter-spacing: 0;
        }

        .section-title .view-all {
            order: 2;
            text-transform: none;
            letter-spacing: 0;
            font-size: 1.1em;
            color: var(--accent);
            white-space: nowrap;
        }

        /* ===================== 文章列表 ===================== */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 34px;
        }

        .post-card {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            padding: 16px 18px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 13px;
            box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-hi);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            cursor: pointer;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        /* 左侧一条竖光，hover 时点亮 */
        .post-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 12px;
            bottom: 12px;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            opacity: 0;
            transform: scaleY(.4);
            transition: all .22s ease;
        }

        .post-card:hover {
            text-decoration: none;
            transform: translateY(-2px);
            border-color: color-mix(in srgb, var(--accent) 40%, var(--glass-border));
            box-shadow: var(--shadow);
        }

        .post-card:hover::before {
            opacity: 1;
            transform: scaleY(1);
        }

        .post-card .pc-main {
            min-width: 0;
            flex: 1;
        }

        .post-card h2 {
            font-size: 1.04em;
            margin-bottom: 5px;
            color: var(--text);
            font-weight: 650;
            letter-spacing: -.01em;
            line-height: 1.45;
        }

        .post-card .excerpt {
            color: var(--text-soft);
            font-size: .86em;
            line-height: 1.6;
            margin-bottom: 9px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-card .pc-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
        }

        .post-card .pc-date {
            font-family: var(--mono);
            font-size: .76em;
            color: var(--text-mute);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .post-card .pc-arrow {
            color: var(--text-mute);
            opacity: 0;
            transform: translateX(-4px);
            transition: all .2s ease;
            font-size: .95em;
        }

        .post-card:hover .pc-arrow {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent);
        }

        .post-meta {
            display: flex;
            gap: 6px;
            font-size: .78em;
            color: var(--text-soft);
            align-items: center;
            flex-wrap: wrap;
        }

        .post-meta .tag {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 1px 9px;
            border-radius: 999px;
            font-size: .95em;
            border: 1px solid color-mix(in srgb, var(--accent) 16%, transparent);
        }

        /* 搜索结果里的卡片网格 */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
            margin-bottom: 34px;
        }

        /* ===================== 项目卡片 ===================== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
            gap: 12px;
            margin-bottom: 34px;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            padding: 17px 18px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-hi);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
            color: inherit;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        /* hover 时从图标位置透出一层彩色光 */
        .project-card::after {
            content: '';
            position: absolute;
            inset: -40% -20% auto -20%;
            height: 70%;
            background: radial-gradient(closest-side, var(--accent), transparent 75%);
            opacity: 0;
            transition: opacity .3s ease;
            pointer-events: none;
        }

        .project-card:hover {
            text-decoration: none;
            transform: translateY(-3px);
            border-color: color-mix(in srgb, var(--accent) 40%, var(--glass-border));
            box-shadow: var(--shadow);
        }

        .project-card:hover::after {
            opacity: .10;
        }

        .project-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .project-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-soft), color-mix(in srgb, var(--accent-2) 12%, transparent));
            border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .project-name {
            font-weight: 650;
            font-size: .98em;
            color: var(--text);
            overflow-wrap: anywhere;
            letter-spacing: -.01em;
        }

        .project-host {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            color: var(--text-mute);
            opacity: .65;
            flex-shrink: 0;
            transition: all .2s;
        }

        .project-host svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .project-card:hover .project-host {
            opacity: 1;
            color: var(--accent);
        }

        .project-desc {
            color: var(--text-soft);
            font-size: .84em;
            line-height: 1.62;
            margin-bottom: 14px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .lang-bar {
            display: flex;
            height: 4px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
            background: color-mix(in srgb, var(--text) 8%, transparent);
            position: relative;
            z-index: 1;
        }

        .lang-bar span {
            display: block;
            height: 100%;
        }

        .project-foot {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .76em;
            color: var(--text-soft);
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .project-lang {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: var(--mono);
        }

        .lang-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .project-stars {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: var(--mono);
            color: var(--text-mute);
        }

        /* ===================== 文章详情 ===================== */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-soft);
            font-size: .86em;
            margin-bottom: 16px;
            cursor: pointer;
            padding: 6px 13px;
            border-radius: 9px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            transition: all .18s;
            font-family: var(--mono);
        }

        .back-btn:hover {
            background: var(--glass-strong);
            color: var(--accent);
            text-decoration: none;
            transform: translateX(-2px);
        }

        .article-header {
            margin-bottom: 26px;
            padding: 26px 28px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-hi);
        }

        .article-header h1 {
            font-size: clamp(1.45em, 1.1em + 1.2vw, 1.95em);
            line-height: 1.3;
            margin-bottom: 14px;
            letter-spacing: -.025em;
        }

        .article-content {
            font-size: 1.01em;
            padding: 30px 32px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-hi);
        }

        .article-content h2 {
            font-size: 1.34em;
            margin: 34px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--glass-line);
            letter-spacing: -.015em;
        }

        .article-content h2:first-child {
            margin-top: 0;
        }

        .article-content h3 {
            font-size: 1.1em;
            margin: 26px 0 11px;
        }

        .article-content p {
            margin-bottom: 17px;
        }

        .article-content ul,
        .article-content ol {
            margin: 0 0 17px 24px;
        }

        .article-content li {
            margin-bottom: 6px;
        }

        .article-content blockquote {
            border-left: 3px solid var(--accent);
            padding: 12px 18px;
            margin: 0 0 17px;
            color: var(--text-soft);
            background: var(--accent-soft);
            border-radius: 0 10px 10px 0;
        }

        .article-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: .87em;
            font-family: var(--mono);
            border: 1px solid var(--glass-line);
        }

        .article-content pre {
            background: color-mix(in srgb, var(--text) 4%, transparent);
            border: 1px solid var(--glass-line);
            padding: 17px 19px;
            border-radius: 11px;
            overflow-x: auto;
            margin-bottom: 17px;
            font-size: .86em;
            line-height: 1.65;
        }

        .article-content pre code {
            background: none;
            border: none;
            padding: 0;
        }

        .article-content img {
            max-width: 100%;
            border-radius: 12px;
            margin: 12px 0;
            border: 1px solid var(--glass-line);
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 17px;
            font-size: .92em;
            display: block;
            overflow-x: auto;
        }

        .article-content th,
        .article-content td {
            border: 1px solid var(--glass-line);
            padding: 8px 12px;
            text-align: left;
        }

        .article-content th {
            background: color-mix(in srgb, var(--text) 5%, transparent);
            font-weight: 600;
        }

        /* ===================== 关于 / 联系 ===================== */
        .about-card {
            padding: 26px 28px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
            backdrop-filter: blur(var(--blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm), inset 0 1px 0 var(--glass-hi);
            margin-bottom: 22px;
        }

        .about-card h2 {
            margin-bottom: 14px;
            font-size: 1.28em;
            letter-spacing: -.015em;
        }

        .about-card h3 {
            margin: 22px 0 10px;
            font-size: .95em;
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--text-mute);
        }

        .about-card p {
            margin-bottom: 13px;
            color: var(--text-soft);
        }

        .about-card ul {
            margin: 0 0 13px 22px;
            color: var(--text-soft);
        }

        .about-card a {
            font-weight: 500;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--glass-line);
        }

        .contact-row:last-child {
            border-bottom: none;
        }

        .contact-label {
            color: var(--text-mute);
            font-size: .76em;
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: .1em;
            min-width: 64px;
        }

        .contact-value {
            flex: 1;
            word-break: break-all;
            font-size: .88em;
        }

        /* ===================== 按钮 ===================== */
        .social-btn,
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 13px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: .8em;
            color: var(--text-soft);
            transition: all .18s;
            cursor: pointer;
            background: color-mix(in srgb, var(--text) 4%, transparent);
            font-family: inherit;
        }

        .social-btn:hover,
        .copy-btn:hover {
            border-color: color-mix(in srgb, var(--accent) 55%, transparent);
            color: var(--accent);
            text-decoration: none;
            transform: translateY(-1px);
            background: var(--accent-soft);
        }

        .social-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .copy-btn.copied {
            border-color: var(--success);
            color: var(--success);
            background: color-mix(in srgb, var(--success) 12%, transparent);
        }

        /* ===================== 状态 / 反馈 ===================== */
        .loading,
        .empty {
            text-align: center;
            padding: 54px 20px;
            color: var(--text-soft);
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            padding: 26px 24px 34px;
            text-align: center;
            color: var(--text-mute);
            font-size: .8em;
            font-family: var(--mono);
        }

        footer a {
            color: var(--text-soft);
        }

        footer a:hover {
            color: var(--accent);
        }

        .fade-in {
            animation: fadeIn .45s cubic-bezier(.16, 1, .3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- 列表卡片依次浮上来 ---- */
        .post-list>.post-card,
        .post-grid>.project-card,
        .project-grid>.project-card {
            animation: cardIn .5s cubic-bezier(.16, 1, .3, 1) backwards;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 前十几张错开一点，再多的不再加延迟，免得等太久 */
        .post-list>*:nth-child(1),
        .post-grid>*:nth-child(1),
        .project-grid>*:nth-child(1) {
            animation-delay: .02s;
        }

        .post-list>*:nth-child(2),
        .post-grid>*:nth-child(2),
        .project-grid>*:nth-child(2) {
            animation-delay: .06s;
        }

        .post-list>*:nth-child(3),
        .post-grid>*:nth-child(3),
        .project-grid>*:nth-child(3) {
            animation-delay: .10s;
        }

        .post-list>*:nth-child(4),
        .post-grid>*:nth-child(4),
        .project-grid>*:nth-child(4) {
            animation-delay: .14s;
        }

        .post-list>*:nth-child(5),
        .post-grid>*:nth-child(5),
        .project-grid>*:nth-child(5) {
            animation-delay: .18s;
        }

        .post-list>*:nth-child(6),
        .post-grid>*:nth-child(6),
        .project-grid>*:nth-child(6) {
            animation-delay: .22s;
        }

        .post-list>*:nth-child(n+7),
        .post-grid>*:nth-child(n+7),
        .project-grid>*:nth-child(n+7) {
            animation-delay: .26s;
        }

        /* ---- 路由切换时整个内容区轻轻升一下 ---- */
        #app.page-enter {
            animation: pageIn .38s cubic-bezier(.16, 1, .3, 1);
        }

        @keyframes pageIn {
            from {
                opacity: .35;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- 阅读进度条（只在文章页出现） ---- */
        .read-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 100%;
            transform: scaleX(0);
            transform-origin: 0 50%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent);
            border-radius: 0 3px 3px 0;
            transition: transform .08s linear, opacity .25s;
            opacity: 0;
            z-index: 300;
            pointer-events: none;
        }

        .read-progress.on {
            opacity: 1;
        }

        /* ---- 回到顶部 ---- */
        .backtop {
            position: fixed;
            right: 24px;
            bottom: 26px;
            width: 46px;
            height: 46px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--accent);
            background: var(--glass);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi);
            cursor: pointer;
            z-index: 150;
            opacity: 0;
            transform: translateY(14px) scale(.9);
            pointer-events: none;
            transition: opacity .25s ease, transform .25s cubic-bezier(.34, 1.56, .64, 1),
                box-shadow .25s ease, border-color .25s ease;
        }

        .backtop.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .backtop:hover {
            border-color: color-mix(in srgb, var(--accent) 45%, var(--glass-border));
            box-shadow: var(--shadow-lg), inset 0 1px 0 var(--glass-hi);
            transform: translateY(-2px) scale(1.04);
        }

        .backtop:active {
            transform: translateY(0) scale(.95);
        }

        .backtop:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .backtop-svg {
            width: 22px;
            height: 22px;
            overflow: visible;
        }

        /* 进度环：周长 2πr ≈ 59.06 */
        .backtop-ring {
            stroke-dasharray: 59.06;
            stroke-dashoffset: 59.06;
            transition: stroke-dashoffset .12s linear;
            opacity: .9;
        }

        .backtop-arrow {
            transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
        }

        .backtop:hover .backtop-arrow {
            transform: translateY(-2px);
        }

        /* ---- 点击后火箭升空 + 粒子 ---- */
        .fx-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .fx-rocket {
            position: absolute;
            width: 38px;
            height: 50px;
            margin: -44px 0 0 -19px;
            color: var(--accent);
            filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 75%, transparent));
            will-change: transform, opacity;
        }

        /* 机尾的尾焰拖尾 */
        .fx-rocket::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 98%;
            width: 12px;
            height: 58px;
            margin-left: -6px;
            border-radius: 0 0 50% 50%;
            background: linear-gradient(180deg,
                    color-mix(in srgb, var(--accent-2) 80%, transparent),
                    transparent 92%);
            filter: blur(4px);
            transform-origin: 50% 0;
            animation: trailPulse .22s ease-in-out infinite alternate;
        }

        @keyframes trailPulse {
            from {
                transform: scaleY(.82) scaleX(.85);
                opacity: .7;
            }

            to {
                transform: scaleY(1.1) scaleX(1.1);
                opacity: 1;
            }
        }

        .fx-rocket svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .fx-rocket .fx-flame {
            transform-origin: 50% 0;
            animation: flameFlicker .18s ease-in-out infinite alternate;
        }

        @keyframes flameFlicker {
            from {
                transform: scaleY(.78) scaleX(.9);
                opacity: .85;
            }

            to {
                transform: scaleY(1.12) scaleX(1.06);
                opacity: 1;
            }
        }

        .fx-spark {
            position: absolute;
            width: 7px;
            height: 7px;
            margin: -3.5px 0 0 -3.5px;
            border-radius: 50%;
            will-change: transform, opacity;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--glass-strong);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 10px 22px;
            border-radius: 11px;
            font-size: .86em;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all .3s ease;

           ── 新增文章 = 往 posts/ 丢一个 .md（然后跑一次脚本）
        ============================================================ */
        const POSTS_INDEX = 'posts/index.json';
        let POSTS = [];
        let postsError = null;
        let postsLoaded = false;

        /* 去掉 .md 顶部的 front matter，否则会被 marked 当成正文渲染出来 */
        function stripFrontMatter(md) {
            return md.replace(/^﻿?---[ \t]*\r?\n[\s\S]*?\r?\n---[ \t]*(\r?\n|$)/, '');
        }

        /* 载入清单。no-cache 保证重新部署后立刻能看到新文章，而不是吃缓存 */
        async function loadPosts() {
            if (postsLoaded) return POSTS;
            try {
                const res = await fetch(POSTS_INDEX, { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                POSTS = Array.isArray(data) ? data : (data.posts || []);
                postsLoaded = true;
                postsError = null; // 上次失败过，这次成功了就把错误清掉
            } catch (e) {
                /* 不设 postsLoaded，这样切页面时还会再试一次 */
                postsError = e.message;
                console.error('[posts] 载入 ' + POSTS_INDEX + ' 失败：' + e.message);
            }
            return POSTS;
        }

            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('blog-theme', theme);
            document.querySelectorAll('[data-theme-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.themeBtn === theme);
            });
        }

        /* ============================================================
           5. 路由
           ============================================================ */
        function navigate(path) { location.hash = '#/' + path; }

        /* slug 里的中文等字符在 URL 里是百分号编码的，取出来要还原 */
        function decodeSlug(s) {
            try { return decodeURIComponent(s); } catch (e) { return s; }
        }

        function parseRoute() {
            const raw = location.hash.replace(/^#\/?/, '');
            const parts = raw.split('/').filter(Boolean);
            if (parts.length === 0) return { page: 'home' };
            if (parts[0] === 'posts') return { page: 'posts' };
            if (parts[0] === 'projects') return { page: 'projects' };
            if (parts[0] === 'about') return { page: 'about' };
            if (parts[0] === 'post' && parts[1]) return { page: 'post', slug: decodeSlug(parts[1]) };
            return { page: 'home' };
        }

        /* 文章之间会互相引用（[01_xxx](01_xxx.md)）。浏览器把这种链接当普通相对路径请求，
           落到 /01_xxx.md 直接 404。这里换成站内路由 #/post/<slug>，交给 hashchange 处理。 */
        function postHref(target) {
            const clean = decodeURIComponent(String(target).split('#')[0].split('?')[0]).replace(/^\.?\//, '');
            if (!/\.md$/i.test(clean)) return null;
            const stem = clean.replace(/\.md$/i, '');
            const hit = POSTS.find(p => (p.file || '').toLowerCase() === clean.toLowerCase())
                     || POSTS.find(p => p.slug === clean)
                     || POSTS.find(p => p.slug === stem)
                     || POSTS.find(p => (p.file || '').replace(/\.md$/i, '') === stem);
            return hit ? '#/post/' + encodeURIComponent(hit.slug) : null;
        }

        /* 渲染完正文后把 .md 链接改成站内跳转。
           万一指向一个没发布的文件（比如 _draft.md），就退回指向 posts/ 下的原始 .md。 */
        function rewritePostLinks(html) {
            return html.replace(/href=(["'])([^"']+\.md(?:#[^"']*)?)\1/gi, (all, q, target) => {
                const href = postHref(target);
                if (href) return 'href=' + q + href + q;
                const clean = decodeURIComponent(String(target).split('#')[0]).replace(/^\.?\//, '');
                return 'href=' + q + 'posts/' + clean + q;
            });
        }

        async function copyText(text, btn) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // 兼容旧浏览器 / 非 HTTPS
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                showToast('✅ Copied: ' + text);
                if (btn) {
                    const original = btn.innerHTML;
                    btn.classList.add('copied');
                    btn.innerHTML = '✓ Copied';

        /* hl 只在搜索结果里传进来（负责转义 + 高亮）；平时走原样插值，行为不变。
           用 typeof 判断而不是真值判断：.map(renderPostCard) 会把下标当成第二个参数传进来。 */
        function renderPostCard(p, hl) {
            const T = (field, s) => (typeof hl === 'function' ? hl(field, s) : s);
            const tags = (p.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');
            return `
    <a class="post-card" onclick="navigate('post/${encodeURIComponent(p.slug)}')">
      <div class="pc-main">
        <h2>${T('title', p.title)}</h2>
        ${p.excerpt ? `<div class="excerpt">${T('excerpt', p.excerpt)}</div>` : ''}
        ${tags ? `<div class="post-meta">${tags}</div>` : ''}
      </div>
      <div class="pc-side">
        <time class="pc-date">${p.date}</time>
        <span class="pc-arrow">→</span>
      </div>
    </a>
  `;
        }

        /* 按日期倒序，文章页和首页都用同一个顺序 */
        function sortedPosts() {
            return POSTS.slice().sort((a, b) => b.date.localeCompare(a.date));
        }

        function postCardsHTML() {
            const sorted = sortedPosts();
            if (!sorted.length) return postsError ? postsErrorHTML() : '<div class="empty">No posts yet.</div>';
            return sorted.map(renderPostCard).join('');
        }

        /* -------- 站点统计（首页数据块 / 侧栏共用） -------- */
        function siteStats() {
            const langs = new Set();
            let stars = 0;
            for (const p of PROJECTS) {
                if (typeof p.stars === 'number') stars += p.stars;
                (p.langs || []).forEach(l => langs.add(l.name));
            }
            return { posts: POSTS.length, projects: PROJECTS.length, stars, languages: langs.size };
        }

        /* 所有文章标签按出现次数排序，取前 n 个 */
        function topTags(n = 8) {
            const counts = new Map();
            for (const p of POSTS) {
                for (const tag of (p.tags || [])) counts.set(tag, (counts.get(tag) || 0) + 1);
            }
            return [...counts.entries()]
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
                .slice(0, n)
                .map(([name, count]) => ({ name, count }));
        }

        function chipsHTML(tags) {
            return tags.map(t => `<span class="chip">${esc(t.name)}<span class="n">${t.count}</span></span>`).join('');
        }

        /* -------- 动效小工具 -------- */
        const reducedMotion = () => {
            try {
                return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            } catch (e) {
                return false;
            }
        };

        /* 换了页面就让内容区重新播一次入场动画 */
        function enterPage() {
            if (!app || !app.classList) return;
            app.classList.remove('page-enter');
            void app.offsetWidth; /* 强制回流，动画才会重新开始 */
            app.classList.add('page-enter');
            updateBackTop();
        }

        /* 数字从 0 数到目标值 */
        function countUp(el, target, dur) {
            const n = Number(target);
            if (!el || !isFinite(n) || reducedMotion() || typeof requestAnimationFrame !== 'function') {
                if (el) el.textContent = target;
                return;
            }
            const now = () => (window.performance && performance.now ? performance.now() : Date.now());
            const t0 = now(), d = dur || 650;
            el.textContent = '0';
            const tick = () => {
                const p = Math.min(1, (now() - t0) / d);
                const eased = 1 - Math.pow(1 - p, 3); /* easeOutCubic */
                el.textContent = String(Math.round(n * eased));
                if (p < 1) requestAnimationFrame(tick);
                else el.textContent = String(n);
            };
            requestAnimationFrame(tick);
        }

        /* 把当前页面里带数字的元素都数一遍 */
        function animateTiles() {
            if (reducedMotion() || typeof document.querySelectorAll !== 'function') return;
            document.querySelectorAll('.tiles .tile b').forEach(el => {
                const n = Number(el.textContent.trim());
                if (isFinite(n) && n > 0) countUp(el, n);
            });
        }

        /* 侧栏那三个数字 */
        function animateCounts() {
            if (reducedMotion() || typeof document.querySelectorAll !== 'function') return;
            document.querySelectorAll('.stat-row .stat b').forEach(el => {
                const n = Number(el.textContent.trim());
                if (isFinite(n) && n > 0) countUp(el, n);
            });
        }

        /* 文章页顶部的阅读进度条 */
        function hideReadProgress() {
            const bar = document.getElementById('read-progress');
            if (!bar) return;
            bar.classList.remove('on');
            bar.style.transform = 'scaleX(0)';
        }

        function updateReadProgress() {
            const bar = document.getElementById('read-progress');
            if (!bar) return;
            const body = document.getElementById('post-body');
            if (!body || typeof body.getBoundingClientRect !== 'function') {
                hideReadProgress();
                return;
            }
            const rect = body.getBoundingClientRect();
            const total = rect.height - window.innerHeight;
            if (total <= 40) { /* 一屏能放下就没必要显示 */
                hideReadProgress();
                return;
            }
            const p = Math.min(1, Math.max(0, -rect.top / total));
            bar.classList.add('on');
            bar.style.transform = 'scaleX(' + p.toFixed(4) + ')';
        }

        /* 右下角「回到顶部」：滚过一段才出现，圆环显示整页进度 */
        const BACKTOP_CIRC = 59.06; /* 2π × 9.4 */
        let rocketBusy = false;

        function updateBackTop() {
            const btn = document.getElementById('backtop');
            if (!btn || rocketBusy) return;
            const y = typeof window.pageYOffset === 'number' ? window.pageYOffset : (window.scrollY || 0);
            const el = document.documentElement;
            const total = el && typeof el.scrollHeight === 'number' ? el.scrollHeight - window.innerHeight : 0;
            const p = total > 0 ? Math.min(1, Math.max(0, y / total)) : 0;
            if (y > 320) btn.classList.add('show');
            else btn.classList.remove('show');
            const ring = document.getElementById('backtop-ring');
            if (ring && ring.style) ring.style.strokeDashoffset = (BACKTOP_CIRC * (1 - p)).toFixed(2);
        }

        function scrollToTop() {
            const smooth = !reducedMotion() && 'scrollBehavior' in document.documentElement.style;
            window.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
        }

        /* 一枚小火箭的 SVG：机身 / 舷窗 / 尾翼 / 喷焰 */
        const ROCKET_SVG = `
  <svg viewBox="0 0 32 44" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="fxBody" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
        <stop stop-color="#fff" stop-opacity=".95"/>
        <stop offset="1" stop-color="currentColor"/>
      </linearGradient>
    </defs>
    <path d="M16 2c5.2 4.2 7.4 10.2 7.4 16.2 0 3.9-.9 7-2.1 9.4H10.7c-1.2-2.4-2.1-5.5-2.1-9.4C8.6 12.2 10.8 6.2 16 2z"
          fill="url(#fxBody)"/>
    <circle cx="16" cy="14.5" r="3.1" fill="#0b1220" fill-opacity=".55"/>
    <circle cx="16" cy="14.5" r="3.1" stroke="#fff" stroke-opacity=".85" stroke-width="1"/>
    <path d="M10.9 24.6 6.6 32.3l5.2-1.4" fill="currentColor" fill-opacity=".85"/>
    <path d="M21.1 24.6l4.3 7.7-5.2-1.4" fill="currentColor" fill-opacity=".85"/>
    <path class="fx-flame" d="M16 28.4c-2.3 3.6-2.5 7.3-.2 10.6.2-3 1-4.6 2.4-6.4-1.4 3.4-.6 5.6.1 6.6 2.2-3.3 2-7-.3-10.8z"
          fill="currentColor" fill-opacity=".7"/>
  </svg>`;

        /* 点按钮：火箭带着一串粒子冲出屏幕顶部，同时页面滚回去 */
        function launchRocket() {
            const btn = document.getElementById('backtop');
            const canAnim = typeof Element.prototype.animate === 'function';
            if (!btn || !canAnim || !document.body || typeof document.body.appendChild !== 'function') {
                scrollToTop();
                return;
            }
            const r = btn.getBoundingClientRect();
            const cx = r.left + r.width / 2;
            const cy = r.top + r.height / 2;

            const layer = document.createElement('div');
            layer.className = 'fx-layer';
            document.body.appendChild(layer);

            const rocket = document.createElement('div');
            rocket.className = 'fx-rocket';
            rocket.innerHTML = ROCKET_SVG;
            rocket.style.left = cx + 'px';
            rocket.style.top = cy + 'px';
            layer.appendChild(rocket);

            /* 一小撮火星，往上散开 */
            const N = 18;
            const colors = ['var(--accent)', 'var(--accent-2)', '#ffffff'];
            for (let i = 0; i < N; i++) {
                const dot = document.createElement('span');
                const size = 4 + Math.random() * 6;
                dot.className = 'fx-spark';
                dot.style.left = cx + 'px';
                dot.style.top = cy + 'px';
                dot.style.width = dot.style.height = size + 'px';
                dot.style.margin = (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px';
                dot.style.background = colors[i % colors.length];
                dot.style.boxShadow = '0 0 8px ' + colors[i % colors.length];
                layer.appendChild(dot);

                const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.4; /* 上方扇形 */
                const dist = 50 + Math.random() * 130;
                dot.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(ang) * dist * 0.55}px, ${Math.sin(ang) * dist * 0.55}px) scale(.7)`, opacity: .8, offset: .55 },
                    { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist + 40}px) scale(.15)`, opacity: 0 },
                ], {
                    duration: 620 + Math.random() * 480,
                    delay: Math.random() * 120,
                    easing: 'cubic-bezier(.16,.7,.3,1)',
                    fill: 'forwards',
                });
            }

            /* 火箭本体：笔直向上，飞到顶部再淡出 */
            const rise = 88 - cy; /* 让机头刚好停在导航条下方 */
            const flight = rocket.animate([
                { transform: 'translateY(0) scale(1)', opacity: 1 },
                { transform: `translateY(${rise * .35}px) scale(1.06)`, opacity: 1, offset: .35 },
                { transform: `translateY(${rise * .8}px) scale(1.02)`, opacity: 1, offset: .8 },
                { transform: `translateY(${rise}px) scale(.7)`, opacity: 0 },
            ], {
                duration: 950,
                easing: 'cubic-bezier(.34,.1,.4,1)',
                fill: 'forwards',
            });

            const done = () => { if (layer.parentNode) layer.parentNode.removeChild(layer); };
            flight.onfinish = done;
            setTimeout(done, 1600); /* 兜底：动画被系统掐掉也要清场 */
        }

        function onBackToTop() {
            if (rocketBusy) return;
            if (reducedMotion()) { scrollToTop(); return; }
            rocketBusy = true;
            const btn = document.getElementById('backtop');
            if (btn) btn.classList.remove('show'); /* 按钮化身火箭，先让位 */
            launchRocket();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { rocketBusy = false; updateBackTop(); }, 1000);
        }

        /* -------- 联系方式行（文章页 / 项目页 / 关于页共用） -------- */

            app.innerHTML = `

        /* -------- 文章页（和项目页同构） -------- */
        function renderPosts() {

        /* -------- 项目卡片 -------- */
        function langColor(name) {
            return LANG_COLORS[name] || '#8b949e';
        }

        /* hl 同 renderPostCard：.map(renderProjectCard) 会把下标传进来，所以用 typeof 判断 */
        function renderProjectCard(p, hl) {
            const T = (field, s) => (typeof hl === 'function' ? hl(field, s) : s);
            const langs = p.langs || [];
            const measured = langs.filter(l => typeof l.pct === 'number');
            const primary = langs[0];
            const hostName = p.host === 'gitee' ? 'Gitee' : 'GitHub';

            /* 语言占比条：只在拿到平台统计数据时才画 */
            const langBar = measured.length > 1

          ${measured.map(l => `<span style="flex:${l.pct};background:${langColor(l.name)}"></span>`).join('')}
        </div>`
                : '';

            /* 有占比 → 只列主语言（附带百分比）；无占比 → 平铺所有语言 */
            let langHTML = '';

          <span class="lang-dot" style="background:${langColor(primary.name)}"></span>
