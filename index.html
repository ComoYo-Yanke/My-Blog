<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoMoYo-Yanke's Blog</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23e8f0fe'/><stop offset='1' stop-color='%23c7d9f7'/></linearGradient></defs><path d='M32 1 L59 17.5 L59 46.5 L32 63 L5 46.5 L5 17.5 Z' fill='url(%23g)'/><text x='32' y='44' font-size='45' font-family='Arial Black,sans-serif' font-weight='900' fill='black' stroke='%232c4a7c' stroke-width='1.2' text-anchor='middle'>Y</text></svg>">
        
    <style>
        :root {
            --bg: #ffffff;
            --bg-soft: #f6f8fa;
            --text: #1f2328;
            --text-soft: #656d76;
            --border: #d0d7de;
            --accent: #0969da;
            --accent-soft: #ddf4ff;
            --code-bg: #f6f8fa;
            --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .04);
            --success: #1a7f37;
        }

        [data-theme="dark"] {
            --bg: #0d1117;
            --bg-soft: #161b22;
            --text: #e6edf3;
            --text-soft: #8b949e;
            --border: #30363d;
            --accent: #58a6ff;
            --accent-soft: #12283f;
            --code-bg: #161b22;
            --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
            --success: #3fb950;
        }

        [data-theme="sepia"] {
            --bg: #f8f1e4;
            --bg-soft: #efe6d5;
            --text: #433422;
            --text-soft: #8a7a63;
            --border: #d9cdb6;
            --accent: #a0522d;
            --accent-soft: #f0e0cc;
            --code-bg: #efe6d5;
            --shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 8px 24px rgba(0, 0, 0, .05);
            --success: #2e7d32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            transition: background .3s ease, color .3s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* 导航 */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .navbar-inner {
            max-width: 880px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .brand:hover {
            text-decoration: none;
        }

        .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
        }

        .nav-links {
            display: flex;
            gap: 4px;
        }

        .nav-links a {
            color: var(--text-soft);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: .92em;
            cursor: pointer;
            transition: all .2s;
        }

        .nav-links a:hover {
            background: var(--bg-soft);
            color: var(--text);
            text-decoration: none;
        }

        .nav-links a.active {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .theme-switch {
            display: flex;
            gap: 3px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
        }

        .theme-btn:hover {
            background: var(--border);
        }

        .theme-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .translate-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 14px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-size: .88em;
            color: var(--text-soft);
            transition: all .2s;
            font-family: inherit;
        }

        .translate-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            flex: 1;
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 32px 0 48px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 48px;
        }

        .avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #a371f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            margin: 0 auto 20px;
            color: #fff;
            box-shadow: var(--shadow);
            letter-spacing: -.02em;
        }

        .hero h1 {
            font-size: 2em;
            margin-bottom: 10px;
            letter-spacing: -.02em;
        }

        .hero p {
            color: var(--text-soft);
            font-size: 1.02em;
            max-width: 480px;
            margin: 0 auto;
        }

        .hero .socials {
            margin-top: 22px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 社交按钮（带图标） */
        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: .88em;
            color: var(--text-soft);
            transition: all .2s;
            cursor: pointer;
            background: transparent;
            font-family: inherit;
        }

        .social-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            text-decoration: none;
            transform: translateY(-1px);
        }

        .social-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 复制按钮 */
        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: .88em;
            color: var(--text-soft);
            cursor: pointer;
            transition: all .2s;
            background: transparent;
            font-family: inherit;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .copy-btn.copied {
            border-color: var(--success);
            color: var(--success);
            background: color-mix(in srgb, var(--success) 10%, transparent);
        }

        .section-title {
            font-size: .82em;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--text-soft);
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* 标题里的计数小圆牌 */
        .section-title .count {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1px 8px;
            font-size: .95em;
            letter-spacing: 0;
        }

        /* 「查看全部 →」放最右边：order 让 .section-title::after 那条线排在它前面 */
        .section-title .view-all {
            order: 2;
            text-transform: none;
            letter-spacing: 0;
            font-size: .95em;
            color: var(--accent);
            white-space: nowrap;
        }

        /* 文章卡片 */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 56px;
        }

        /* 文章页：和项目页一样的网格 */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            margin-bottom: 56px;
        }

        /* 网格里让卡片等高，日期/标签对齐到卡片底部 */
        .post-grid .post-card {
            display: flex;
            flex-direction: column;
        }

        .post-grid .post-card .post-meta {
            margin-top: auto;
        }

        .post-card {
            display: block;
            padding: 20px 22px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all .22s ease;
            cursor: pointer;
            color: inherit;
        }

        .post-card:hover {
            text-decoration: none;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .post-card h2 {
            font-size: 1.18em;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 650;
        }

        .post-card .excerpt {
            color: var(--text-soft);
            font-size: .93em;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-meta {
            display: flex;
            gap: 14px;
            font-size: .82em;
            color: var(--text-soft);
            align-items: center;
            flex-wrap: wrap;
        }

        .post-meta .tag {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: .95em;
        }

        /* ========== 项目卡片 ========== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            margin-bottom: 56px;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all .22s ease;
            color: inherit;
            text-decoration: none;
        }

        .project-card:hover {
            text-decoration: none;
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .project-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .project-icon {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .project-name {
            font-weight: 650;
            font-size: 1.02em;
            color: var(--text);
            overflow-wrap: anywhere;
        }

        /* 仓库所在平台（GitHub / Gitee） */
        .project-host {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            color: var(--text-soft);
            opacity: .6;
            flex-shrink: 0;
        }

        .project-host svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .project-card:hover .project-host {
            opacity: 1;
            color: var(--accent);
        }

        .project-desc {
            color: var(--text-soft);
            font-size: .88em;
            margin-bottom: 14px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 语言占比条（GitHub Linguist 统计） */
        .lang-bar {
            display: flex;
            height: 4px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
            background: var(--bg-soft);
        }

        .lang-bar span {
            display: block;
            height: 100%;
        }

        .project-foot {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .8em;
            color: var(--text-soft);
            flex-wrap: wrap;
        }

        .project-lang {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .lang-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .project-stars {
            margin-left: auto;
        }

        /* 文章详情 */
        .article-header {
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .article-header h1 {
            font-size: 2em;
            line-height: 1.3;
            margin-bottom: 16px;
            letter-spacing: -.02em;
        }

        .article-content {
            font-size: 1.02em;
        }

        .article-content h2 {
            font-size: 1.4em;
            margin: 36px 0 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .article-content h3 {
            font-size: 1.15em;
            margin: 28px 0 12px;
        }

        .article-content p {
            margin-bottom: 18px;
        }

        .article-content ul,
        .article-content ol {
            margin: 0 0 18px 24px;
        }

        .article-content li {
            margin-bottom: 6px;
        }

        .article-content blockquote {
            border-left: 4px solid var(--accent);
            padding: 4px 0 4px 18px;
            margin: 0 0 18px;
            color: var(--text-soft);
            background: var(--bg-soft);
            border-radius: 0 8px 8px 0;
        }

        .article-content code {
            background: var(--code-bg);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: .88em;
            font-family: "SFMono-Regular", Consolas, monospace;
            border: 1px solid var(--border);
        }

        .article-content pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 10px;
            overflow-x: auto;
            margin-bottom: 18px;
            font-size: .88em;
            line-height: 1.6;
        }

        .article-content pre code {
            background: none;
            border: none;
            padding: 0;
        }

        .article-content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 12px 0;
        }

        .article-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
            font-size: .94em;
        }

        .article-content th,
        .article-content td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .article-content th {
            background: var(--bg-soft);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-soft);
            font-size: .9em;
            margin-bottom: 28px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all .2s;
        }

        .back-btn:hover {
            background: var(--bg-soft);
            color: var(--accent);
            text-decoration: none;
        }

        /* 关于页 */
        .about-card {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
        }

        .about-card h2 {
            margin-bottom: 16px;
            font-size: 1.4em;
        }

        .about-card p {
            margin-bottom: 14px;
            color: var(--text-soft);
        }

        .about-card ul {
            margin: 0 0 14px 22px;
            color: var(--text-soft);
        }

        .about-card a {
            font-weight: 500;
        }

        /* 联系方式行 */
        .contact-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }

        .contact-row:last-child {
            border-bottom: none;
        }

        .contact-label {
            color: var(--text-soft);
            font-size: .9em;
            min-width: 70px;
        }

        .contact-value {
            flex: 1;
            word-break: break-all;
            font-size: .92em;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-soft);
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 28px 24px;
            text-align: center;
            color: var(--text-soft);
            font-size: .85em;
        }

        footer a {
            color: var(--text-soft);
        }

        footer a:hover {
            color: var(--accent);
        }

        .fade-in {
            animation: fadeIn .35s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--text);
            color: var(--bg);
            padding: 10px 22px;
            border-radius: 10px;
            font-size: .9em;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: all .3s ease;
            z-index: 999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Google 翻译：隐藏默认横幅和工具栏 */
        /* .goog-te-banner-frame,
        .skiptranslate>iframe.goog-te-banner-frame {
            display: none !important;
        } */

        body {
            top: 0 !important;
        }

        .goog-tooltip,
        .goog-tooltip:hover {
            display: none !important;
        }

        .goog-text-highlight {
            background: none !important;
            box-shadow: none !important;
        }

        #google_translate_element {
            display: none;
        }

        @media (max-width: 640px) {
            .container {
                padding: 28px 16px 60px;
            }

            .navbar-inner {
                padding: 12px 16px;
            }

            .hero h1 {
                font-size: 1.6em;
            }

            .article-header h1 {
                font-size: 1.5em;
            }

            .nav-links a {
                padding: 6px 9px;
                font-size: .86em;
            }

            .theme-btn {
                width: 27px;
                height: 27px;
                font-size: 12px;
            }

            .translate-btn {
                height: 32px;
                padding: 0 10px;
                font-size: .82em;
            }

            .project-grid,
            .post-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="navbar-inner">
            <a class="brand" onclick="navigate('home')">
                <span class="brand-dot"></span>CoMoYo-Yanke
            </a>
            <div class="nav-links">
                <a data-nav="home" onclick="navigate('home')">Home</a>
                <a data-nav="posts" onclick="navigate('posts')">Posts</a>
                <a data-nav="projects" onclick="navigate('projects')">Projects</a>
                <a data-nav="about" onclick="navigate('about')">About</a>
            </div>
            <div class="controls">
                <!-- TODO -->
                <!-- <button class="translate-btn" onclick="toggleTranslate()" id="translateBtn">
                    🌐 <span>中文</span> 
                </button>  -->
                <div class="theme-switch">
                    <button class="theme-btn" data-theme-btn="light" title="Light">☀️</button>
                    <button class="theme-btn" data-theme-btn="sepia" title="Sepia">📖</button>
                    <button class="theme-btn" data-theme-btn="dark" title="Dark">🌙</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container" id="app"></main>

    <footer>
        © 2026 CoMoYo-Yanke · Powered by
        <a href="https://pages.cloudflare.com" target="_blank">Cloudflare Pages</a>
    </footer>

    <div id="google_translate_element"></div>
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        /* ============================================================
           1. 站点配置
           ============================================================ */
        const SITE = {
            name: 'CoMoYo-Yanke',
            avatar: 'CY',
            bio: 'A place to record learning, thoughts and life.',
            github: 'https://github.com/ComoYo-Yanke',
            gitee: 'https://gitee.com/yanke_4_0',
            email: 'comoyoyanke@outlook.com',
        };

        /* ============================================================
           2. 文章清单
           ── 不再手写数组：清单由 scripts/build-posts.mjs 扫描 posts/*.md 生成，
              文章元信息写在每个 .md 顶部的 front matter 里
           ── 新增文章 = 往 posts/ 丢一个 .md（然后跑一次脚本）
        ============================================================ */
        const POSTS_INDEX = 'posts/index.json';
        let POSTS = [];
        let postsError = null;
        let postsLoaded = false;

        /* 去掉 .md 顶部的 front matter，否则会被 marked 当成正文渲染出来 */
        function stripFrontMatter(md) {
            return md.replace(/^﻿?---[ \t]*\r?\n[\s\S]*?\r?\n---[ \t]*(\r?\n|$)/, '');
        }

        /* 载入清单。no-cache 保证重新部署后立刻能看到新文章，而不是吃缓存 */
        async function loadPosts() {
            if (postsLoaded) return POSTS;
            try {
                const res = await fetch(POSTS_INDEX, { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                POSTS = Array.isArray(data) ? data : (data.posts || []);
                postsLoaded = true;
                postsError = null; // 上次失败过，这次成功了就把错误清掉
            } catch (e) {
                /* 不设 postsLoaded，这样切页面时还会再试一次 */
                postsError = e.message;
                console.error('[posts] 载入 ' + POSTS_INDEX + ' 失败：' + e.message);
            }
            return POSTS;
        }

        function postsErrorHTML() {

      <p>😕 Could not load <code>${POSTS_INDEX}</code> (${postsError})</p>
      <p style="margin-top:10px;font-size:.9em">

      </p>
    </div>`;

        function decodeSlug(s) {
            try { return decodeURIComponent(s); } catch (e) { return s; }

        function parseRoute() {
            const raw = location.hash.replace(/^#\/?/, '');
            const parts = raw.split('/').filter(Boolean);
            if (parts.length === 0) return { page: 'home' };
            if (parts[0] === 'posts') return { page: 'posts' };
            if (parts[0] === 'projects') return { page: 'projects' };
            if (parts[0] === 'about') return { page: 'about' };
            if (parts[0] === 'post' && parts[1]) return { page: 'post', slug: decodeSlug(parts[1]) };
            return { page: 'home' };

            const toast = document.getElementById('toast');

            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        async function copyText(text, btn) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // 兼容旧浏览器 / 非 HTTPS
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                showToast('✅ Copied: ' + text);
                if (btn) {
                    const original = btn.innerHTML;
                    btn.classList.add('copied');
                    btn.innerHTML = '✓ Copied';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = original;
                    }, 1500);

            } catch (e) {
                showToast('❌ Copy failed');

        /* -------- 文章详情 -------- */
        async function renderPost(slug, seq) {

            const meta = POSTS.find(p => p.slug === slug);

            if (!meta) {

            }

            document.title = meta.title + ' - ' + SITE.name;

            app.innerHTML = `
    <a class="back-btn" onclick="navigate('home')">← Back to list</a>
    <article class="fade-in">
      <header class="article-header">
        <h1>${meta.title}</h1>
        <div class="post-meta">
          <span>📅 ${meta.date}</span>
          ${(meta.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}

        <div class="loading"><div class="spinner"></div>Loading...</div>
      </div>
    </article>
  `;
            window.scrollTo(0, 0);

            const body = document.getElementById('post-body');
            /* 用清单里的真实文件名取内容：文件名可以是中文，slug 只负责 URL */
            const file = meta.file || slug + '.md';
            try {
                const res = await fetch('posts/' + encodeURIComponent(file));
                if (!res.ok) throw new Error('not found');
                const md = await res.text();
                if (seq !== navSeq) return; // 正文还在路上时用户又跳走了，别覆盖新页面
                body.innerHTML = marked.parse(stripFrontMatter(md));
            } catch (e) {
                if (seq !== navSeq) return;
                body.innerHTML = `<div class="empty">😕 Failed to load post (posts/${file})</div>`;
                return;
            }
            /* 翻译是可选项，单独兜底：它自己出问题也不能把已经渲染好的正文顶掉 */
            try {
                if (isTranslated()) triggerTranslate();
            } catch (e) {
                console.warn('[translate] ' + e.message);
            }
        }

        /* 每次导航自增。带 await 的渲染回来后先对一下号，
           防止慢的那次把用户已经切过去的新页面覆盖掉。
           例：清单还没载完就点了 Projects，首页那次渲染回来会把项目页顶掉。 */
        let navSeq = 0;

        async function router() {
            const seq = ++navSeq;
            const route = parseRoute();
            if (route.page === 'projects') renderProjects();
            else if (route.page === 'about') renderAbout();
            else {
                await loadPosts(); // 首页 / 文章页 / 文章详情都要先拿到清单
                if (seq !== navSeq) return;
                if (route.page === 'posts') renderPosts();
                else if (route.page === 'post') await renderPost(route.slug, seq);
                else renderHome();
            }
        }

        /* ============================================================
           9. 初始化
           ============================================================ */
        function init() {
            const savedTheme = localStorage.getItem('blog-theme');
            if (savedTheme && THEMES.includes(savedTheme)) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.querySelectorAll('[data-theme-btn]').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.themeBtn === savedTheme);
                });
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }

            document.querySelectorAll('[data-theme-btn]').forEach(btn => {
                btn.addEventListener('click', () => applyTheme(btn.dataset.themeBtn));
            });

            /* router 要先等清单载入，先摆个转圈占位 */
            app.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';

            window.addEventListener('hashchange', router);
            router();
            updateTranslateBtn();
            loadGoogleTranslate();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
