<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="煤球数目：第 n 层比上一层多 n 个，前 100 层共 171700 个">
  <rect x="0" y="0" width="760" height="380" rx="14" fill="#f7f8fa" stroke="#e3e6ea"/>
  <text x="32" y="42" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600" fill="#2b3038">煤球数目</text>
  <text x="132" y="42" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#8b93a2">2016 · C/C++ B 组 · 填空题</text>
  <text x="32" y="68" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#7b8494">每层排成三角形，第 n 层有 n 行，共 n(n+1)/2 个</text>

  <!-- 第 1 层 -->
  <text x="86" y="136" text-anchor="end" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b93a2">第 1 层</text>
  <circle cx="100" cy="130" r="6" fill="#93b4f5" stroke="#3b82f6" stroke-width="1"/>

  <!-- 第 2 层 -->
  <text x="86" y="186" text-anchor="end" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b93a2">第 2 层</text>
  <g fill="#93b4f5" stroke="#3b82f6" stroke-width="1">
    <circle cx="100" cy="180" r="6"/><circle cx="120" cy="180" r="6"/><circle cx="140" cy="180" r="6"/>
  </g>

  <!-- 第 3 层 -->
  <text x="86" y="236" text-anchor="end" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b93a2">第 3 层</text>
  <g fill="#93b4f5" stroke="#3b82f6" stroke-width="1">
    <circle cx="100" cy="230" r="6"/><circle cx="120" cy="230" r="6"/><circle cx="140" cy="230" r="6"/>
    <circle cx="160" cy="230" r="6"/><circle cx="180" cy="230" r="6"/><circle cx="200" cy="230" r="6"/>
  </g>

  <!-- 第 4 层 -->
  <text x="86" y="286" text-anchor="end" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8b93a2">第 4 层</text>
  <g fill="#93b4f5" stroke="#3b82f6" stroke-width="1">
    <circle cx="100" cy="280" r="6"/><circle cx="120" cy="280" r="6"/><circle cx="140" cy="280" r="6"/>
    <circle cx="160" cy="280" r="6"/><circle cx="180" cy="280" r="6"/><circle cx="200" cy="280" r="6"/>
    <circle cx="220" cy="280" r="6"/><circle cx="240" cy="280" r="6"/><circle cx="260" cy="280" r="6"/>
    <circle cx="280" cy="280" r="6"/>
  </g>

  <!-- 递推标注 -->
  <g font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#4a5260">
    <text x="330" y="136">a₁ = 1</text>
    <text x="330" y="186">a₂ = a₁ + 2 = 3</text>
    <text x="330" y="236">a₃ = a₂ + 3 = 6</text>
    <text x="330" y="286" font-weight="600" fill="#3b82f6">a₄ = a₃ + 4 = 10</text>
  </g>

  <text x="330" y="322" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5b6472">第 n 层比上一层多 n 个 → aₙ = n(n+1)/2</text>
  <text x="330" y="352" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#d97706">S₁₀₀ = Σ aₙ = 171700</text>
</svg>
